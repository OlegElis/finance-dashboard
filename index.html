<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>УПР.Финансы</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700;900&display=swap');
  :root {
    --bg:#0e0f11;--surface:#16181c;--surface2:#1e2128;--border:#2a2d35;
    --accent:#3ddc84;--accent2:#5b8dee;--accent3:#f5a623;--danger:#e8413e;
    --text:#e8eaf0;--text2:#8a8f9e;--text3:#555a6a;
    --income:#3ddc84;--outcome:#e8413e;
    --mono:'JetBrains Mono',monospace;--head:'Unbounded',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;min-height:100vh;overflow-x:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .logo{font-family:var(--head);font-size:13px;font-weight:900;letter-spacing:-0.5px;color:var(--accent);}
  .logo span{color:var(--text2);font-weight:400;}
  .status-bar{display:flex;align-items:center;gap:16px;font-size:10px;color:var(--text3);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:6px;}
  .status-dot.ok{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .status-dot.loading{background:var(--accent3);animation:pulse 1s infinite;}
  .status-dot.error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .setup-panel{margin:24px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
  .setup-title{font-family:var(--head);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .form-group label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--text);font-family:var(--mono);font-size:11px;outline:none;transition:border-color 0.2s;}
  .form-group input:focus{border-color:var(--accent);}
  .form-group input::placeholder{color:var(--text3);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:4px;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:600;transition:all 0.2s;text-transform:uppercase;letter-spacing:1px;}
  .btn-primary{background:var(--accent);color:#0e0f11;}
  .btn-primary:hover{background:#4ef09a;transform:translateY(-1px);}
  .btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--text2);color:var(--text);}
  .setup-hint{margin-top:16px;padding:12px 16px;background:rgba(93,141,238,0.08);border:1px solid rgba(93,141,238,0.2);border-radius:4px;font-size:10px;color:var(--accent2);line-height:1.8;}
  .tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--border);gap:2px;background:var(--surface);}
  .tab{padding:12px 20px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;letter-spacing:0.5px;}
  .tab:hover{color:var(--text2);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .filters{display:flex;gap:12px;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:flex-end;}
  .filter-group label{display:block;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .filter-group select{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-family:var(--mono);font-size:10px;outline:none;cursor:pointer;min-width:120px;}
  .filter-group select:focus{border-color:var(--accent);}
  .content{padding:24px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;position:relative;overflow:hidden;}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
  .kpi-card.green::before{background:var(--income);}
  .kpi-card.red::before{background:var(--outcome);}
  .kpi-card.blue::before{background:var(--accent2);}
  .kpi-card.orange::before{background:var(--accent3);}
  .kpi-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
  .kpi-value{font-family:var(--head);font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.5px;}
  .kpi-value.positive{color:var(--income);}
  .kpi-value.negative{color:var(--outcome);}
  .kpi-sub{font-size:9px;color:var(--text3);margin-top:4px;}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .table-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);}
  .table-title{font-family:var(--head);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
  .table-count{font-size:10px;color:var(--text3);}
  .report-table{width:100%;border-collapse:collapse;font-size:11px;}
  .report-table th{background:var(--surface2);padding:8px 16px;text-align:right;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;white-space:nowrap;}
  .report-table th:first-child,.report-table th:nth-child(2){text-align:left;}
  .report-table td{padding:7px 16px;text-align:right;border-top:1px solid var(--border);white-space:nowrap;color:var(--text2);}
  .report-table td:first-child,.report-table td:nth-child(2){text-align:left;}
  .report-table tr:hover td{background:rgba(255,255,255,0.02);}
  .report-table tr.total td{background:var(--surface2);color:var(--text);font-weight:700;border-top:2px solid var(--border);}
  .report-table tr.subtotal td{background:rgba(61,220,132,0.04);font-weight:600;color:var(--text);}
  .report-table tr.section-header td{background:var(--surface2);color:var(--accent2);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
  .num-positive{color:var(--income)!important;}
  .num-negative{color:var(--outcome)!important;}
  .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.5px;}
  .badge-fns{background:rgba(61,220,132,0.15);color:var(--income);}
  .badge-nofns{background:rgba(91,141,238,0.15);color:var(--accent2);}
  .badge-unknown{background:rgba(245,166,35,0.15);color:var(--accent3);}
  .state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--text3);gap:12px;}
  .state-box .icon{font-size:32px;}
  .state-box .msg{font-size:12px;color:var(--text2);}
  .state-box .sub{font-size:10px;color:var(--text3);}
  .hidden{display:none!important;}
  .table-scroll{overflow-x:auto;}
  .percent-row td{font-style:italic;color:var(--text3)!important;font-size:10px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">УПР<span>.</span>Финансы</div>
  <div class="status-bar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">Не подключено</span></span>
  </div>
</div>

<div class="setup-panel" id="setupPanel">
  <div class="setup-title">⚙ Подключение к Google Sheets</div>
  <div class="setup-grid">
    <div class="form-group">
      <label>ID таблицы</label>
      <input type="text" id="sheetId" placeholder="Часть URL между /d/ и /edit" />
    </div>
    <div class="form-group">
      <label>Google API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="connectAndLoad()">▶ Подключить и загрузить</button>
    <button class="btn btn-secondary" onclick="loadDemo()">◎ Демо-данные</button>
  </div>
  <div class="setup-hint">
    <strong>ID таблицы:</strong> из URL — часть между /d/ и /edit<br>
    <strong>API Key:</strong> уже создан в Google Cloud Console<br>
    <strong>Таблица:</strong> должна быть открыта "Для всех у кого есть ссылка" (Просмотр)<br>
    <strong>Лист:</strong> должен называться <code>RawData</code>, первая строка — заголовки
  </div>
</div>

<div class="tabs hidden" id="tabsBar">
  <div class="tab active" onclick="switchTab('bank')">🏦 БАНК</div>
  <div class="tab" onclick="switchTab('dds')">📊 ДДС</div>
  <div class="tab" onclick="switchTab('opiu')">📈 ОПиУ</div>
  <div class="tab" onclick="switchTab('fot')">💳 ФОТ</div>
</div>

<div class="filters hidden" id="filtersBar">
  <div class="filter-group">
    <label>Направление</label>
    <select id="fDirection" onchange="renderActiveTab()"><option value="">Все направления</option></select>
  </div>
  <div class="filter-group">
    <label>Период</label>
    <select id="fPeriodType" onchange="renderActiveTab()">
      <option value="year">По годам</option>
      <option value="quarter">По кварталам</option>
      <option value="month">По месяцам</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Год</label>
    <select id="fYear" onchange="renderActiveTab()"><option value="">Все годы</option></select>
  </div>
  <div class="filter-group">
    <label>Месяц</label>
    <select id="fMonth" onchange="renderActiveTab()"><option value="">Все месяцы</option></select>
  </div>
  <div class="filter-group" id="fotFilters" style="display:none">
    <label>Детализация ФОТ</label>
    <select id="fFotDetail" onchange="renderActiveTab()">
      <option value="direction">По направлению</option>
      <option value="subarticle">По подстатье</option>
      <option value="counterparty">По контрагенту</option>
    </select>
  </div>
</div>

<div class="content hidden" id="mainContent">
  <div id="tabBank"></div>
  <div id="tabDds" class="hidden"></div>
  <div id="tabOpiu" class="hidden"></div>
  <div id="tabFot" class="hidden"></div>
</div>

<script>
const COL={DATE_DDS:0,DATE_OPIU:1,TYPE:2,OFFER_ID:3,INCOME:4,OUTCOME:5,FNS:6,ACCOUNT:7,ARTICLE_CODE:8,ARTICLE_NAME:9,ANALYTICS:10,SECOND_SIDE:11,PURPOSE:12,ACTIVITY_DIR:13,FIN_OP:14};
const MONTHS_FULL=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const FOT_PREFIXES=['111_','226_','127_'];
const REVENUE_PREFIX='120_';
let RAW=[];
let activeTab='bank';

function parseNum(v){if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n;}
function fmt(v){if(typeof v!=='number'||isNaN(v))return'—';return v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(v){if(typeof v!=='number'||isNaN(v))return'—';return(v*100).toFixed(1)+'%';}
function numClass(v){if(typeof v!=='number')return'';return v>0?'num-positive':v<0?'num-negative':'';}
function parseDate(v){if(!v)return null;if(v instanceof Date)return v;const s=String(v).trim();const m1=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m1)return new Date(+m1[3],+m1[2]-1,+m1[1]);const m2=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m2)return new Date(+m2[1],+m2[2]-1,+m2[3]);return null;}
function getYear(row){const d=parseDate(row[COL.DATE_OPIU])||parseDate(row[COL.DATE_DDS]);return d?d.getFullYear():null;}
function getMonth(row){const d=parseDate(row[COL.DATE_OPIU])||parseDate(row[COL.DATE_DDS]);return d?d.getMonth()+1:null;}
function getPeriodKey(row,mode){const year=getYear(row),month=getMonth(row);if(!year)return null;if(mode==='year')return String(year);if(mode==='quarter')return`Q${Math.ceil((month||1)/3)} ${year}`;if(!month)return null;return`${MONTHS_FULL[month-1]} ${year}`;}
function periodSortKey(k,mode){if(mode==='year')return k;if(mode==='quarter'){const[q,y]=k.split(' ');return`${y}-${q}`;}const parts=k.split(' ');const mi=MONTHS_FULL.indexOf(parts[0])+1;return`${parts[1]}-${String(mi).padStart(2,'0')}`;}
function setStatus(dot,text){document.getElementById('statusDot').className='status-dot '+dot;document.getElementById('statusText').textContent=text;}
function td(val,extra=''){const v=typeof val==='number'?val:parseNum(val);const cls=numClass(v);const display=typeof val==='number'?fmt(val):(val||'—');return`<td class="${cls} ${extra}">${display}</td>`;}

function getFilters(){return{direction:document.getElementById('fDirection').value,periodType:document.getElementById('fPeriodType').value,year:document.getElementById('fYear').value,month:document.getElementById('fMonth').value,fotDetail:document.getElementById('fFotDetail').value};}
function applyBaseFilters(data,f){return data.filter(row=>{if(f.direction&&String(row[COL.ACTIVITY_DIR]||'').trim()!==f.direction)return false;if(f.year&&String(getYear(row))!==f.year)return false;if(f.month){const m=getMonth(row);if(!m||MONTHS_FULL[m-1]!==f.month)return false;}const inc=parseNum(row[COL.INCOME]),out=parseNum(row[COL.OUTCOME]);return inc!==0||out!==0;});}
function buildFilterOptions(data){const dirs=[...new Set(data.map(r=>String(r[COL.ACTIVITY_DIR]||'').trim()).filter(Boolean))].sort();const years=[...new Set(data.map(r=>getYear(r)).filter(Boolean))].sort((a,b)=>b-a);const sel=(id,vals,placeholder)=>{const el=document.getElementById(id);const cur=el.value;el.innerHTML=`<option value="">${placeholder}</option>`+vals.map(v=>`<option value="${v}">${v}</option>`).join('');if(vals.includes(cur))el.value=cur;};sel('fDirection',dirs,'Все направления');sel('fYear',years.map(String),'Все годы');sel('fMonth',MONTHS_FULL,'Все месяцы');}

async function connectAndLoad(){
  const sheetId=document.getElementById('sheetId').value.trim();
  const apiKey=document.getElementById('apiKey').value.trim();
  if(!sheetId||!apiKey){alert('Укажи ID таблицы и API Key');return;}
  setStatus('loading','Загрузка...');
  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/RawData?key=${apiKey}`;
    const resp=await fetch(url);
    if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.statusText);}
    const json=await resp.json();
    const rows=json.values||[];
    if(rows.length<2)throw new Error('Нет данных в RawData');
    RAW=rows.slice(1).map(r=>{while(r.length<15)r.push('');return r.map((v,i)=>{if(i===COL.INCOME||i===COL.OUTCOME)return parseNum(v);return v;});});
    onDataLoaded();
  }catch(e){setStatus('error','Ошибка: '+e.message);alert('Ошибка:\n'+e.message);}
}

function onDataLoaded(){
  setStatus('ok',`${RAW.length.toLocaleString('ru-RU')} строк загружено`);
  buildFilterOptions(RAW);
  document.getElementById('setupPanel').classList.add('hidden');
  document.getElementById('tabsBar').classList.remove('hidden');
  document.getElementById('filtersBar').classList.remove('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  renderActiveTab();
}

function loadDemo(){
  const dirs=['Основное','Аренда','Консалтинг'];
  const accounts=['Тинькофф 4521','Сбер 8842','Наличные'];
  const articles=[['120_Выручка','120_Выручка'],['111_ФОТ','111_ФОТ'],['226_Аутсорс','226_Аутсорс'],['310_Аренда','310_Аренда'],['290_Прочее','290_Прочее']];
  const analytics=['Прямые / Переменные','Прямые / Постоянные','Косвенные / Постоянные','Налоги / проценты / амортизация','Вывод чистой прибыли'];
  const cfTypes=['001_Операционная деятельность','002_Финансовая деятельность','003_Инвестиционная деятельность'];
  const contractors=['ООО Ромашка','ИП Иванов А.А.','ООО ТехПром','Сотрудник 1','Сотрудник 2'];
  RAW=[];
  for(let i=0;i<800;i++){
    const d=new Date(2024,Math.floor(Math.random()*12),Math.floor(Math.random()*28)+1);
    const isIncome=Math.random()>0.55;
    const dir=dirs[Math.floor(Math.random()*dirs.length)];
    const art=articles[isIncome?0:Math.floor(Math.random()*(articles.length-1))+1];
    const amount=(Math.random()*500000+10000).toFixed(2)*1;
    const an=isIncome?'':analytics[Math.floor(Math.random()*analytics.length)];
    const row=new Array(15).fill('');
    const ds=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
    row[COL.DATE_DDS]=ds;row[COL.DATE_OPIU]=ds;
    row[COL.TYPE]=isIncome?'поступление':'списание';
    row[COL.INCOME]=isIncome?amount:0;row[COL.OUTCOME]=isIncome?0:-amount;
    row[COL.FNS]=Math.random()>0.4?'Да':'Нет';
    row[COL.ACCOUNT]=accounts[Math.floor(Math.random()*accounts.length)];
    row[COL.ARTICLE_CODE]=art[0];row[COL.ARTICLE_NAME]=art[1];
    row[COL.ANALYTICS]=an;
    row[COL.SECOND_SIDE]=contractors[Math.floor(Math.random()*contractors.length)];
    row[COL.ACTIVITY_DIR]=dir;
    row[COL.FIN_OP]=cfTypes[Math.floor(Math.random()*cfTypes.length)];
    RAW.push(row);
  }
  onDataLoaded();
}

function switchTab(name){
  activeTab=name;
  document.querySelectorAll('.tab').forEach((t,i)=>{const tabs=['bank','dds','opiu','fot'];t.classList.toggle('active',tabs[i]===name);});
  ['bank','dds','opiu','fot'].forEach(t=>{document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('hidden',t!==name);});
  document.getElementById('fotFilters').style.display=name==='fot'?'block':'none';
  renderActiveTab();
}
function renderActiveTab(){const f=getFilters();if(activeTab==='bank')renderBank(f);else if(activeTab==='dds')renderDDS(f);else if(activeTab==='opiu')renderOPIU(f);else if(activeTab==='fot')renderFOT(f);}

function renderBank(f){
  const el=document.getElementById('tabBank');
  const data=applyBaseFilters(RAW,{...f,direction:'',year:'',month:''});
  const map=new Map();
  data.forEach(row=>{
    let acc=String(row[COL.ACCOUNT]||'').trim()||'⚠️ Нет реквизитов';
    const fnsRaw=String(row[COL.FNS]||'').toLowerCase().trim();
    const isFns=['да','true','1','+'].includes(fnsRaw);
    const isNoFns=['нет','false','0','-'].includes(fnsRaw);
    const inc=parseNum(row[COL.INCOME]),out=parseNum(row[COL.OUTCOME]);
    if(!map.has(acc))map.set(acc,{name:acc,fns:isFns?1:isNoFns?0:-1,inc:0,out:0});
    const e=map.get(acc);e.inc+=inc;e.out+=out;
    if(e.fns===-1&&(isFns||isNoFns))e.fns=isFns?1:0;
  });
  const fns=[],nofns=[],unk=[];
  map.forEach(a=>{a.total=a.inc+a.out;(a.fns===1?fns:a.fns===0?nofns:unk).push(a);});
  [fns,nofns,unk].forEach(arr=>arr.sort((a,b)=>b.total-a.total));
  let totInc=0,totOut=0,totAll=0;
  [...fns,...nofns,...unk].forEach(a=>{totInc+=a.inc;totOut+=a.out;totAll+=a.total;});
  const saldo=totInc+totOut;
  const kpiHtml=`<div class="kpi-grid">
    <div class="kpi-card green"><div class="kpi-label">Поступления</div><div class="kpi-value positive">${fmt(totInc)}</div><div class="kpi-sub">₽</div></div>
    <div class="kpi-card red"><div class="kpi-label">Списания</div><div class="kpi-value negative">${fmt(totOut)}</div><div class="kpi-sub">₽</div></div>
    <div class="kpi-card blue"><div class="kpi-label">Сальдо</div><div class="kpi-value ${saldo>=0?'positive':'negative'}">${fmt(saldo)}</div><div class="kpi-sub">₽</div></div>
    <div class="kpi-card orange"><div class="kpi-label">Счетов ФНС</div><div class="kpi-value">${fns.length}</div><div class="kpi-sub">из ${map.size} счетов</div></div>
  </div>`;
  const buildSection=(arr,label,badgeClass,badgeText)=>{
    if(!arr.length)return'';
    const rows=arr.map(a=>`<tr><td><span class="badge ${badgeClass}">${badgeText}</span></td><td>${a.name}</td>${td(a.inc)}${td(a.out)}${td(a.total)}</tr>`).join('');
    const si=arr.reduce((s,a)=>s+a.inc,0),so=arr.reduce((s,a)=>s+a.out,0),st=arr.reduce((s,a)=>s+a.total,0);
    return`<tr class="section-header"><td colspan="2">${label}</td><td></td><td></td><td></td></tr>${rows}<tr class="subtotal"><td></td><td>Итого</td>${td(si)}${td(so)}${td(st)}</tr>`;
  };
  el.innerHTML=kpiHtml+`<div class="table-wrap"><div class="table-header"><span class="table-title">Свод по денежным средствам</span><span class="table-count">${map.size} счетов · ${data.length.toLocaleString('ru-RU')} строк</span></div><div class="table-scroll"><table class="report-table"><thead><tr><th>ФНС</th><th>Счёт</th><th>Поступление</th><th>Списание</th><th>Итого</th></tr></thead><tbody>${buildSection(fns,'ФНС — Налоговая выручка','badge-fns','ДА')}${buildSection(nofns,'Денежные средства (не ФНС)','badge-nofns','НЕТ')}${buildSection(unk,'Требует классификации','badge-unknown','?')}<tr class="total"><td></td><td>ИТОГО</td>${td(totInc)}${td(totOut)}${td(totAll)}</tr></tbody></table></div></div>`;
}

function renderDDS(f){
  const el=document.getElementById('tabDds');
  const mode=f.periodType;
  const data=applyBaseFilters(RAW,f).filter(r=>String(r[COL.TYPE]||'').trim().toLowerCase()!=='перемещение');
  if(!data.length){el.innerHTML=emptyState();return;}
  const periodsSet=new Set(),psk={};
  const grand={inc:{},out:{}};
  const sections={};
  ['001_','002_','003_'].forEach(k=>sections[k]={inc:{},out:{},incSub:{},outArt:{}});
  data.forEach(row=>{
    const pk=getPeriodKey(row,mode);if(!pk)return;
    periodsSet.add(pk);psk[pk]=periodSortKey(pk,mode);
    const inc=parseNum(row[COL.INCOME]),out=parseNum(row[COL.OUTCOME]);
    const cfRaw=String(row[COL.FIN_OP]||'').trim();
    const cfKey=cfRaw.startsWith('001_')?'001_':cfRaw.startsWith('002_')?'002_':cfRaw.startsWith('003_')?'003_':null;
    if(inc!==0)grand.inc[pk]=(grand.inc[pk]||0)+inc;
    if(out!==0)grand.out[pk]=(grand.out[pk]||0)+out;
    if(cfKey){
      const sec=sections[cfKey];
      if(inc!==0){const sub=String(row[COL.ARTICLE_NAME]||row[COL.ARTICLE_CODE]||'Без подстатьи').trim();sec.inc[pk]=(sec.inc[pk]||0)+inc;if(!sec.incSub[sub])sec.incSub[sub]={};sec.incSub[sub][pk]=(sec.incSub[sub][pk]||0)+inc;}
      if(out!==0){const art=String(row[COL.ARTICLE_CODE]||'Без статьи').trim();sec.out[pk]=(sec.out[pk]||0)+out;if(!sec.outArt[art])sec.outArt[art]={};sec.outArt[art][pk]=(sec.outArt[art][pk]||0)+out;}
    }
  });
  const periods=[...periodsSet].sort((a,b)=>psk[a].localeCompare(psk[b]));
  const np=periods.length;
  const totalInc=periods.map(p=>grand.inc[p]||0);
  const totalOut=periods.map(p=>grand.out[p]||0);
  const saldo=periods.map((_,i)=>totalInc[i]+totalOut[i]);
  let running=0;
  const cumSaldo=saldo.map(s=>{running+=s;return running;});
  const kpiHtml=`<div class="kpi-grid">
    <div class="kpi-card green"><div class="kpi-label">Поступления</div><div class="kpi-value positive">${fmt(totalInc.reduce((a,b)=>a+b,0))}</div></div>
    <div class="kpi-card red"><div class="kpi-label">Выплаты</div><div class="kpi-value negative">${fmt(totalOut.reduce((a,b)=>a+b,0))}</div></div>
    <div class="kpi-card ${running>=0?'green':'red'}"><div class="kpi-label">Кумулятивное сальдо</div><div class="kpi-value ${running>=0?'positive':'negative'}">${fmt(running)}</div></div>
    <div class="kpi-card blue"><div class="kpi-label">Периодов</div><div class="kpi-value">${np}</div></div>
  </div>`;
  const ths=periods.map(p=>`<th>${p}</th>`).join('');
  const trRow=(label,vals,cls='')=>`<tr class="${cls}"><td></td><td>${label}</td>${vals.map(v=>td(v)).join('')}<td class="${numClass(vals.reduce((a,b)=>a+(typeof b==='number'?b:0),0))}">${fmt(vals.reduce((a,b)=>a+(typeof b==='number'?b:0),0))}</td></tr>`;
  const sectionNames={'001_':'I. Операционная деятельность','002_':'II. Финансовая деятельность','003_':'III. Инвестиционная деятельность'};
  let sectHtml='';
  ['001_','002_','003_'].forEach(k=>{
    const sec=sections[k];
    sectHtml+=`<tr class="section-header"><td></td><td>${sectionNames[k]}</td>${periods.map(()=>'<td></td>').join('')}<td></td></tr>`;
    Object.entries(sec.incSub).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([sub,byP])=>{const vals=periods.map(p=>byP[p]||0);sectHtml+=`<tr><td></td><td style="padding-left:24px;font-size:10px">▸ ${sub}</td>${vals.map(v=>td(v)).join('')}<td class="${numClass(vals.reduce((a,b)=>a+b,0))}">${fmt(vals.reduce((a,b)=>a+b,0))}</td></tr>`;});
    Object.entries(sec.outArt).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([art,byP])=>{const vals=periods.map(p=>byP[p]||0);sectHtml+=`<tr><td></td><td style="padding-left:24px;font-size:10px">▸ ${art}</td>${vals.map(v=>td(v)).join('')}<td class="${numClass(vals.reduce((a,b)=>a+b,0))}">${fmt(vals.reduce((a,b)=>a+b,0))}</td></tr>`;});
    const secTot=periods.map(p=>(sec.inc[p]||0)+(sec.out[p]||0));
    sectHtml+=trRow(`Итого по разделу:`,secTot,'subtotal');
    sectHtml+=`<tr><td colspan="${np+3}"></td></tr>`;
  });
  el.innerHTML=kpiHtml+`<div class="table-wrap"><div class="table-header"><span class="table-title">Движение денежных средств</span><span class="table-count">${data.length.toLocaleString('ru-RU')} строк · ${np} периодов</span></div><div class="table-scroll"><table class="report-table"><thead><tr><th></th><th></th>${ths}<th>ИТОГО</th></tr></thead><tbody>${trRow('ПОСТУПЛЕНИЯ',totalInc,'subtotal')}${trRow('ВЫПЛАТЫ',totalOut,'subtotal')}${trRow('САЛЬДО ПЕРИОДА',saldo,'subtotal')}${trRow('КУМУЛЯТИВНОЕ САЛЬДО',cumSaldo,'subtotal')}<tr><td colspan="${np+3}" style="height:8px"></td></tr>${sectHtml}</tbody></table></div></div>`;
}

function renderOPIU(f){
  const el=document.getElementById('tabOpiu');
  const mode=f.periodType;
  const data=applyBaseFilters(RAW,f).filter(r=>String(r[COL.TYPE]||'').trim().toLowerCase()!=='перемещение');
  if(!data.length){el.innerHTML=emptyState();return;}
  const periodsSet=new Set(),psk={};
  const rev={byP:{},total:0,bySub:{}};
  const CATS=['Прямые / Переменные','Прямые / Постоянные','Косвенные / Переменные','Косвенные / Постоянные','Налоги / проценты / амортизация','Вывод чистой прибыли'];
  const exp={};CATS.forEach(c=>exp[c]={byP:{},total:0,byArt:{}});
  data.forEach(row=>{
    const pk=getPeriodKey(row,mode);if(!pk)return;
    periodsSet.add(pk);psk[pk]=periodSortKey(pk,mode);
    const type=String(row[COL.TYPE]||'').trim().toLowerCase();
    const ac=String(row[COL.ARTICLE_CODE]||'').trim();
    const an=String(row[COL.ARTICLE_NAME]||'').trim();
    const analytics=String(row[COL.ANALYTICS]||'').trim();
    const inc=parseNum(row[COL.INCOME]),out=parseNum(row[COL.OUTCOME]);
    if((type==='поступление'||ac.startsWith(REVENUE_PREFIX)||an.startsWith(REVENUE_PREFIX))&&inc>0){
      rev.byP[pk]=(rev.byP[pk]||0)+inc;rev.total+=inc;
      const sub=an||ac||'Без подстатьи';
      if(!rev.bySub[sub])rev.bySub[sub]={byP:{},total:0};
      rev.bySub[sub].byP[pk]=(rev.bySub[sub].byP[pk]||0)+inc;rev.bySub[sub].total+=inc;
    }
    if(type==='списание'&&out<0){
      if(analytics!=='Вывод чистой прибыли'){/* totalExp */}
      if(analytics&&exp[analytics]){
        exp[analytics].byP[pk]=(exp[analytics].byP[pk]||0)+out;exp[analytics].total+=out;
        const art=ac||'Без статьи';
        if(!exp[analytics].byArt[art])exp[analytics].byArt[art]={byP:{},total:0};
        exp[analytics].byArt[art].byP[pk]=(exp[analytics].byArt[art].byP[pk]||0)+out;exp[analytics].byArt[art].total+=out;
      }
    }
  });
  const periods=[...periodsSet].sort((a,b)=>psk[a].localeCompare(psk[b]));
  const np=periods.length;
  const V=cat=>periods.map(p=>exp[cat].byP[p]||0);
  const revV=periods.map(p=>rev.byP[p]||0);
  const dirVar=V('Прямые / Переменные'),dirFix=V('Прямые / Постоянные');
  const indVar=V('Косвенные / Переменные'),indFix=V('Косвенные / Постоянные');
  const taxes=V('Налоги / проценты / амортизация'),withdrawal=V('Вывод чистой прибыли');
  const marginal=periods.map((_,i)=>revV[i]+dirVar[i]);
  const gross=periods.map((_,i)=>marginal[i]+dirFix[i]);
  const ebitda=periods.map((_,i)=>gross[i]+indVar[i]+indFix[i]);
  const net=periods.map((_,i)=>ebitda[i]+taxes[i]);
  const totRev=revV.reduce((a,b)=>a+b,0),totNet=net.reduce((a,b)=>a+b,0),totEbitda=ebitda.reduce((a,b)=>a+b,0);
  const base=Math.abs(totRev)||1;
  const kpiHtml=`<div class="kpi-grid">
    <div class="kpi-card green"><div class="kpi-label">Выручка</div><div class="kpi-value positive">${fmt(totRev)}</div></div>
    <div class="kpi-card blue"><div class="kpi-label">EBITDA</div><div class="kpi-value ${totEbitda>=0?'positive':'negative'}">${fmt(totEbitda)}</div><div class="kpi-sub">${fmtPct(totEbitda/base)}</div></div>
    <div class="kpi-card ${totNet>=0?'green':'red'}"><div class="kpi-label">Чистая прибыль</div><div class="kpi-value ${totNet>=0?'positive':'negative'}">${fmt(totNet)}</div><div class="kpi-sub">${fmtPct(totNet/base)}</div></div>
    <div class="kpi-card orange"><div class="kpi-label">Периодов</div><div class="kpi-value">${np}</div></div>
  </div>`;
  const ths=periods.map(p=>`<th>${p}</th>`).join('');
  const makeRow=(label,vals,cls='',indent=0)=>{const tot=vals.reduce((a,b)=>a+(typeof b==='number'?b:0),0);return`<tr class="${cls}"><td></td><td style="padding-left:${indent}px">${label}</td>${vals.map(v=>td(v)).join('')}<td class="${numClass(tot)}">${fmt(tot)}</td></tr>`;};
  const makePct=(label,vals)=>`<tr class="percent-row"><td></td><td style="padding-left:16px">${label}</td>${vals.map(v=>`<td>${fmtPct(v)}</td>`).join('')}<td>${fmtPct(vals.reduce((a,b)=>a+b,0)/np)}</td></tr>`;
  const sectHead=label=>`<tr class="section-header"><td></td><td>${label}</td>${periods.map(()=>'<td></td>').join('')}<td></td></tr>`;
  const blank=`<tr><td colspan="${np+3}" style="height:4px"></td></tr>`;
  const artRows=(cat,indent=36)=>Object.entries(exp[cat].byArt).filter(([_,d])=>d.total!==0).sort((a,b)=>a[0].localeCompare(b[0])).map(([art,d])=>makeRow(art,periods.map(p=>d.byP[p]||0),'',indent)).join('');
  el.innerHTML=kpiHtml+`<div class="table-wrap"><div class="table-header"><span class="table-title">Отчёт о прибылях и убытках</span><span class="table-count">${data.length.toLocaleString('ru-RU')} строк</span></div><div class="table-scroll"><table class="report-table"><thead><tr><th></th><th></th>${ths}<th>ИТОГО</th></tr></thead><tbody>
    ${makeRow('ВЫРУЧКА',revV,'subtotal')}
    ${Object.entries(rev.bySub).filter(([_,d])=>d.total!==0).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,d])=>makeRow(s,periods.map(p=>d.byP[p]||0),'',16)).join('')}
    ${blank}${sectHead('ПРОИЗВОДСТВЕННЫЕ РАСХОДЫ')}
    ${makeRow('Прямые / Переменные',dirVar,'',16)}${artRows('Прямые / Переменные')}
    ${blank}${makeRow('МАРЖИНАЛЬНЫЙ ДОХОД',marginal,'subtotal')}
    ${makePct('Маржинальность, %',marginal.map((v,i)=>revV[i]!==0?v/Math.abs(revV[i]):0))}
    ${blank}${makeRow('Прямые / Постоянные',dirFix,'',16)}${artRows('Прямые / Постоянные')}
    ${makeRow('ВАЛОВАЯ ПРИБЫЛЬ',gross,'subtotal')}
    ${makePct('Рентабельность по валовой прибыли, %',gross.map((v,i)=>revV[i]!==0?v/Math.abs(revV[i]):0))}
    ${blank}${sectHead('КОСВЕННЫЕ РАСХОДЫ')}
    ${makeRow('Косвенные / Переменные',indVar,'',16)}${artRows('Косвенные / Переменные')}
    ${blank}${makeRow('Косвенные / Постоянные',indFix,'',16)}${artRows('Косвенные / Постоянные')}
    ${blank}${makeRow('ОПЕРАЦИОННАЯ ПРИБЫЛЬ (EBITDA)',ebitda,'subtotal')}
    ${makePct('Рентабельность по EBITDA, %',ebitda.map((v,i)=>revV[i]!==0?v/Math.abs(revV[i]):0))}
    ${blank}${sectHead('РАСХОДЫ НИЖЕ EBITDA')}
    ${makeRow('Налоги / проценты / амортизация',taxes,'',16)}${artRows('Налоги / проценты / амортизация')}
    ${blank}${makeRow('ЧИСТАЯ ПРИБЫЛЬ (УБЫТОК)',net,'subtotal')}
    ${makePct('Рентабельность по чистой прибыли, %',net.map((v,i)=>revV[i]!==0?v/Math.abs(revV[i]):0))}
    ${blank}${sectHead('РАСПРЕДЕЛЕНИЕ')}
    ${makeRow('Вывод чистой прибыли',withdrawal,'',16)}${artRows('Вывод чистой прибыли')}
  </tbody></table></div></div>`;
}

function renderFOT(f){
  const el=document.getElementById('tabFot');
  const mode=f.periodType,detail=f.fotDetail||'direction';
  const data=applyBaseFilters(RAW,f).filter(row=>{
    const type=String(row[COL.TYPE]||'').trim().toLowerCase();
    if(type!=='списание')return false;
    if(parseNum(row[COL.OUTCOME])>=0)return false;
    const ac=String(row[COL.ARTICLE_CODE]||'').trim(),an=String(row[COL.ARTICLE_NAME]||'').trim();
    return FOT_PREFIXES.some(p=>ac.startsWith(p)||an.startsWith(p));
  });
  if(!data.length){el.innerHTML=emptyState('Нет данных ФОТ','Статьи должны начинаться с 111_, 226_, или 127_');return;}
  const periodsSet=new Set(),psk={};
  const byPrimary={},totalByP={};
  data.forEach(row=>{
    const pk=getPeriodKey(row,mode);if(!pk)return;
    periodsSet.add(pk);psk[pk]=periodSortKey(pk,mode);
    const out=parseNum(row[COL.OUTCOME]);
    const dir=String(row[COL.ACTIVITY_DIR]||'Не указано').trim();
    const sub=String(row[COL.ARTICLE_NAME]||row[COL.ARTICLE_CODE]||'Без подстатьи').trim();
    const cp=String(row[COL.SECOND_SIDE]||'Не указан').trim();
    const key=detail==='direction'?dir:detail==='subarticle'?sub:cp;
    if(!byPrimary[key])byPrimary[key]={};
    byPrimary[key][pk]=(byPrimary[key][pk]||0)+out;
    totalByP[pk]=(totalByP[pk]||0)+out;
  });
  const periods=[...periodsSet].sort((a,b)=>psk[a].localeCompare(psk[b]));
  const np=periods.length;
  const grandTotal=Object.values(totalByP).reduce((a,b)=>a+b,0);
  const kpiHtml=`<div class="kpi-grid">
    <div class="kpi-card red"><div class="kpi-label">ФОТ итого</div><div class="kpi-value negative">${fmt(grandTotal)}</div></div>
    <div class="kpi-card orange"><div class="kpi-label">Среднее / период</div><div class="kpi-value negative">${fmt(grandTotal/Math.max(1,np))}</div></div>
    <div class="kpi-card blue"><div class="kpi-label">Строк</div><div class="kpi-value">${data.length.toLocaleString('ru-RU')}</div></div>
    <div class="kpi-card green"><div class="kpi-label">Групп</div><div class="kpi-value">${Object.keys(byPrimary).length}</div></div>
  </div>`;
  const ths=periods.map(p=>`<th>${p}</th>`).join('');
  const rows=Object.entries(byPrimary).filter(([_,bp])=>Object.values(bp).some(v=>v!==0)).sort((a,b)=>a[0].localeCompare(b[0])).map(([key,bp])=>{const vals=periods.map(p=>bp[p]||0);const tot=vals.reduce((a,b)=>a+b,0);return`<tr><td></td><td>${key}</td>${vals.map(v=>td(v)).join('')}<td class="${numClass(tot)}">${fmt(tot)}</td></tr>`;}).join('');
  const totVals=periods.map(p=>totalByP[p]||0),grand=totVals.reduce((a,b)=>a+b,0);
  el.innerHTML=kpiHtml+`<div class="table-wrap"><div class="table-header"><span class="table-title">Фонд оплаты труда и аутсорсинг</span><span class="table-count">${data.length.toLocaleString('ru-RU')} строк</span></div><div class="table-scroll"><table class="report-table"><thead><tr><th></th><th></th>${ths}<th>ИТОГО</th></tr></thead><tbody>${rows}<tr class="total"><td></td><td>ИТОГО</td>${totVals.map(v=>td(v)).join('')}<td class="${numClass(grand)}">${fmt(grand)}</td></tr></tbody></table></div></div>`;
}

function emptyState(msg='Нет данных',sub='Попробуй изменить фильтры'){return`<div class="state-box"><div class="icon">◎</div><div class="msg">${msg}</div><div class="sub">${sub}</div></div>`;}
